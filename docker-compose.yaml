services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - 54327:5432
    environment:
      - POSTGRES_PASSWORD=thanachotxx234
      - POSTGRES_USER=thanachot
      - POSTGRES_DB=thanachot
    volumes:
      - .data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: thanachot-n@rmutp.ac.th
      PGADMIN_DEFAULT_PASSWORD: thanachotxx234
